# Night Courier — Supabase project configuration.
#
# The local stack (`npx supabase@3.2.0 start`) reads this file as it is. A
# hosted project gets it with:
#
#   npx supabase@3.2.0 link --project-ref <your-project-ref>
#   npx supabase@3.2.0 config diff          # read what would change
#   npx supabase@3.2.0 config push --yes
#
# `config push` sends the settings this file declares, where the project
# differs, and nothing else: whatever the file does not mention stays as it is
# on the project - the SMTP settings made in the dashboard, for one. So a
# setting that has to hold belongs in this file. One changed in the dashboard
# alone is put back by the next push if the file says otherwise, and is written
# down nowhere if the file is silent.
#
# The push asks before it writes, and where nobody can answer - a script, a
# session - it stops and changes nothing; that is what `--yes` is for. The
# checks that show a push arrived are in docs/GO-LIVE.md, "Setting up the
# hosted project".
#
# The version is named on purpose. `npx supabase` alone is whatever is newest,
# and versions differ in what these commands do: see scripts/supabase-cli.mjs.

project_id = "night-courier"

[auth]
enabled = true

# The app is a native one and has no website. These are what a link in an auth
# email would be allowed to return to - and there is none: the emails carry a
# code to type into the app (the templates under [auth.email], below). A link
# came back through the app's URL scheme with a whole session in it, for
# whichever app on the phone answered to the scheme.
#
# Each entry stands for itself and nothing longer. Review asked the local stack
# for links back to nightcourier://reset and to an Expo Go address, and both
# came back as plain nightcourier://. "exp://" is for Expo Go in development and
# harmless as it stands; with a wildcard it would let a link open any Expo Go
# project, so it must never be given one on the hosted project.
site_url = "nightcourier://"
additional_redirect_urls = ["nightcourier://", "exp://"]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
# Nothing in this app is anonymous: every message has a named sender who is an
# accepted friend of the recipient.
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Matches PASSWORD_MIN_LENGTH in src/features/auth/validation.ts.
minimum_password_length = 8

[auth.email]
# Sign-up by email is allowed. (`enabled` is this CLI's name for what version 2
# called `enable_signup`.)
enabled = true

# OFF, deliberately and temporarily.
#
# Supabase's built-in email service refuses to deliver to any address that is
# not on the project's team, and caps the project at two messages per hour. With
# confirmations on and no custom SMTP, a friend's signup fails silently: the
# account is created and the code never arrives.
#
# Turn this back on at the same time as configuring custom SMTP, and before
# anyone but the operator has an account. Password reset is only a recovery
# route if the address is known to be real, and a typo'd address on a project
# with no support desk is a permanent lockout.
enable_confirmations = false

# Changing an email address still has to be confirmed on both the old and the
# new address — that one is an account-takeover route, not a convenience.
double_confirm_changes = true
secure_password_change = true

# No `max_frequency` here. The local stack's own default is one second between
# two emails to the same address; a push would carry a line here to the hosted
# project and lower its sixty seconds to that. The app waits those sixty
# seconds itself before it offers a new code (RESEND_WAIT_SECONDS in
# src/features/auth/use-resend-wait.ts).

# The emails carry a code to type into the app, and no link. Eight digits, as
# many as the app's code field asks for (EMAIL_CODE_LENGTH in
# src/features/auth/validation.ts); the auth server takes six to ten.
otp_length = 8

# A day, in seconds, where the auth server's own is an hour: someone who signs
# up in the evening may open the email the next morning. The longer life makes
# guessing no easier. Anyone can ask for a new code for any address at any
# time, so what holds guessing back is the eight digits and the hosted
# project's limit on attempts from one network address; each new code replaces
# the one before, and a code works once. The same life applies to every code
# by email: for a new account's address, for a new password, and for a changed
# address.
otp_expiry = 86400

# Both say what the code is for and what to do with it, in the app's words. The
# auth server fills in {{ .Token }}, the code; nothing else of its own.
[auth.email.template.confirmation]
subject = "Your Night Courier code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your Night Courier code"
content_path = "./supabase/templates/recovery.html"

# Every other email the auth server can send carries a code too, and no link.
# The app asks for none of them, but anyone can ask the auth server for a
# sign-in code by email for any address with an account, a signed-in account
# can ask to change its address, and the operator can invite. The auth
# server's own templates for the sign-in, the change of address and the
# invitation carry a link that signs in whoever follows it, through the app's
# URL scheme; src/tests/email-codes.test.ts checks every template here.
[auth.email.template.magic_link]
subject = "Your Night Courier code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Your Night Courier code"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Your Night Courier code"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Night Courier code"
content_path = "./supabase/templates/reauthentication.html"

# No sign-up by phone number, so there is nothing to confirm either.
[auth.sms]
enabled = false
