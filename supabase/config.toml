# Night Courier — Supabase project configuration.
#
# The local stack (`npx supabase@3.2.0 start`) reads this file as it is. A
# hosted project gets it with:
#
#   npx supabase@3.2.0 link --project-ref <your-project-ref>
#   npx supabase@3.2.0 config diff          # read what would change
#   npx supabase@3.2.0 config push --yes
#
# `config push` sends the settings this file declares, where the project
# differs, and nothing else: whatever the file does not mention stays as it is
# on the project - the SMTP settings made in the dashboard, for one. So a
# setting that has to hold belongs in this file. One changed in the dashboard
# alone is put back by the next push if the file says otherwise, and is written
# down nowhere if the file is silent.
#
# The push asks before it writes, and where nobody can answer - a script, a
# session - it stops and changes nothing; that is what `--yes` is for. The
# checks that show a push arrived are in docs/GO-LIVE.md, "Setting up the
# hosted project".
#
# The version is named on purpose. `npx supabase` alone is whatever is newest,
# and versions differ in what these commands do: see scripts/supabase-cli.mjs.

project_id = "night-courier"

[auth]
enabled = true

# The app is a native one and has no website. These are what a link in an auth
# email is allowed to return to.
site_url = "nightcourier://"
additional_redirect_urls = ["nightcourier://", "exp://"]

jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
# Nothing in this app is anonymous: every message has a named sender who is an
# accepted friend of the recipient.
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Matches PASSWORD_MIN_LENGTH in src/features/auth/validation.ts.
minimum_password_length = 8

[auth.email]
# Sign-up by email is allowed. (`enabled` is this CLI's name for what version 2
# called `enable_signup`.)
enabled = true

# OFF, deliberately and temporarily.
#
# Supabase's built-in email service refuses to deliver to any address that is
# not on the project's team, and caps the project at two messages per hour. With
# confirmations on and no custom SMTP, a friend's signup fails silently: the
# account is created and the link never arrives.
#
# Turn this back on at the same time as configuring custom SMTP, and before
# anyone but the operator has an account. Password reset is only a recovery
# route if the address is known to be real, and a typo'd address on a project
# with no support desk is a permanent lockout.
enable_confirmations = false

# Changing an email address still has to be confirmed on both the old and the
# new address — that one is an account-takeover route, not a convenience.
double_confirm_changes = true
secure_password_change = true

# No `max_frequency` here. The local stack's own default is one second between
# two emails to the same address; a push would carry a line here to the hosted
# project and lower its sixty seconds to that.

# No sign-up by phone number, so there is nothing to confirm either.
[auth.sms]
enabled = false
