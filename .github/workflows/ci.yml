name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally before committing.
      - name: Verify
        run: npm run verify

      - name: Check that the committed artwork matches its source
        run: |
          npm run generate:assets
          git diff --exit-code -- assets/images \
            || (echo "::error::assets/images is out of date — run 'npm run generate:assets' and commit the result" && exit 1)
