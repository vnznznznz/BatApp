name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres for src/tests/db/concurrency.pg.test.mjs. The rest of the
    # database tests run in PGlite, which is a single connection and cannot make
    # two transactions race; these can. Without DATABASE_URL they skip, so this
    # service is what makes CI run them rather than report them as skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally before committing.
      - name: Verify
        run: npm run verify

      - name: Check that the committed artwork matches its source
        run: |
          npm run generate:assets
          git diff --exit-code -- assets/images \
            || (echo "::error::assets/images is out of date — run 'npm run generate:assets' and commit the result" && exit 1)
