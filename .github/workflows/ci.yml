name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres for src/tests/db/concurrency.pg.test.mjs. The rest of the
    # database tests run in PGlite, which is a single connection and cannot make
    # two transactions race; these can. Without DATABASE_URL they skip, so this
    # service is what makes CI run them rather than report them as skipped.
    #
    # Version 17, because that is what the local Supabase stack and a new hosted
    # project run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate developers run locally before committing. Its typecheck
      # generates the route types first (npm run generate:routes): they are not
      # committed, and without them a link to a screen that does not exist
      # would pass.
      - name: Verify
        run: npm run verify

      - name: Check that the committed artwork matches its source
        run: |
          npm run generate:assets
          git diff --exit-code -- assets/images \
            || (echo "::error::assets/images is out of date — run 'npm run generate:assets' and commit the result" && exit 1)

  # What only the bundler notices: an image that is not there, an import that
  # Jest resolves and Metro does not, a screen that cannot be rendered for the
  # web. None of the checks above builds the app. A job of its own, beside the
  # other, so that the two minutes it takes are not added to the wait.
  bundle:
    name: Bundle for the web and for iOS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Stand-ins. A production bundle is not built without a Supabase URL and
      # key (metro.config.js), and nothing in this job ever calls them.
      EXPO_PUBLIC_SUPABASE_URL: https://night-courier-ci.invalid
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_stand_in
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle for the web
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web"

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios"
